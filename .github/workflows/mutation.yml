name: Mutation testing

# Slow, so it runs on demand (at the end of each milestone) and weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mutate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
